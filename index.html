<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>死ね</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* アスペクト比を維持して画面内に収める (画面全体に敷き詰めたい場合は cover に変更) */
            outline: none;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 
        loop: 無限ループ再生 
        autoplay muted: 自動再生を有効化（※ブラウザの仕様上、無音再生でのみ自動再生が許可されます）
        playsinline: モバイル環境対応
    -->
    <video id="myVideo" src="死ね.mp4" loop autoplay muted playsinline></video>

    <script>
        const video = document.getElementById('myVideo');

        // キーボード入力を検出してスペースキーで再生/一時停止を切り替え
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ') {
                // スペースキーによるページスクロールを防止
                e.preventDefault();

                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            }
        });
    </script>

</body>
</html>
